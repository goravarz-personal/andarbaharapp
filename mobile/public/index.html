<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="Game nights, buy-ins and who owes whom." />

    <!-- Installable-app plumbing. Without the manifest and the service worker
         registered below, a phone will not offer to install this. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0B3D2E" />

    <!-- iOS ignores most of the manifest, and needs its own tags to open
         full screen with the right icon once added to the home screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AndarBahar" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />

    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        /* Matches the app background, so there is no white flash on load and
           no white bar under the notch on a phone. */
        background-color: #f3f1ea;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }

      /* Shown until React paints, so opening the app never looks broken. */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #0b3d2e;
        color: #f6e7c2;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        transition: opacity 0.25s ease;
      }
      #boot img {
        width: 86px;
        height: 86px;
        border-radius: 22px;
      }
      #boot span {
        font-size: 14px;
        letter-spacing: 0.4px;
        opacity: 0.85;
      }
      #boot.done {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <div id="boot">
      <img src="/icons/icon-192.png" alt="" />
      <span>AndarBahar</span>
    </div>

    <div id="root"></div>

    <script>
      // Hide the splash once the app has actually rendered something.
      (function () {
        var boot = document.getElementById('boot');
        var root = document.getElementById('root');
        if (!boot || !root) return;

        function dismiss() {
          boot.classList.add('done');
          setTimeout(function () {
            boot.remove();
          }, 300);
        }

        var observer = new MutationObserver(function () {
          if (root.childElementCount > 0) {
            observer.disconnect();
            dismiss();
          }
        });
        observer.observe(root, { childList: true });

        // Never leave someone staring at the splash if something goes wrong.
        setTimeout(dismiss, 8000);
      })();

      // Register the service worker. Failure here is not fatal - it only means
      // the app cannot be installed to the home screen on this device.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
